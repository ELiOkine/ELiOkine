<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Achievement medals">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b37a"/>
      <stop offset="50%" stop-color="#9a7340"/>
      <stop offset="100%" stop-color="#6e4f28"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e2c0"/>
      <stop offset="100%" stop-color="#9a7340"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="280" fill="#141210"/>

  <!-- Medal 1 -->
  <g transform="translate(150,18)" filter="url(#shadow)">
    <polygon points="-18,0 18,0 12,42 -12,42" fill="#234e3a"/>
    <polygon points="-18,0 -4,0 -10,42 -22,42" fill="#1a3a2b"/>
    <circle cx="0" cy="118" r="58" fill="url(#gold)"/>
    <circle cx="0" cy="118" r="48" fill="#141210" stroke="#f3e2c0" stroke-width="2"/>
    <text x="0" y="112" text-anchor="middle" fill="#f3e2c0" font-family="Georgia, serif" font-size="22" font-weight="700">800k+</text>
    <text x="0" y="136" text-anchor="middle" fill="#9a7340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">GHµ VOLUME</text>
    <text x="0" y="214" text-anchor="middle" fill="#e7e2d8" font-family="Georgia, serif" font-size="15">Production</text>
  </g>

  <!-- Medal 2 -->
  <g transform="translate(450,18)" filter="url(#shadow)">
    <polygon points="-18,0 18,0 12,42 -12,42" fill="#234e3a"/>
    <polygon points="-18,0 -4,0 -10,42 -22,42" fill="#1a3a2b"/>
    <circle cx="0" cy="118" r="58" fill="url(#gold)"/>
    <circle cx="0" cy="118" r="48" fill="#141210" stroke="#f3e2c0" stroke-width="2"/>
    <text x="0" y="116" text-anchor="middle" fill="#f3e2c0" font-family="Georgia, serif" font-size="28" font-weight="700">15</text>
    <text x="0" y="138" text-anchor="middle" fill="#9a7340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">MODULES</text>
    <text x="0" y="214" text-anchor="middle" fill="#e7e2d8" font-family="Georgia, serif" font-size="15">iSmartPay</text>
  </g>

  <!-- Medal 3 -->
  <g transform="translate(750,18)" filter="url(#shadow)">
    <polygon points="-18,0 18,0 12,42 -12,42" fill="#234e3a"/>
    <polygon points="-18,0 -4,0 -10,42 -22,42" fill="#1a3a2b"/>
    <circle cx="0" cy="118" r="58" fill="url(#gold)"/>
    <circle cx="0" cy="118" r="48" fill="#141210" stroke="#f3e2c0" stroke-width="2"/>
    <text x="0" y="112" text-anchor="middle" fill="#f3e2c0" font-family="Georgia, serif" font-size="16" font-weight="700">CAMBRIDGE</text>
    <text x="0" y="136" text-anchor="middle" fill="#9a7340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">DS  ·  ML  ·  AI</text>
    <text x="0" y="214" text-anchor="middle" fill="#e7e2d8" font-family="Georgia, serif" font-size="15">Case studies</text>
  </g>

  <!-- Medal 4 -->
  <g transform="translate(1050,18)" filter="url(#shadow)">
    <polygon points="-18,0 18,0 12,42 -12,42" fill="#234e3a"/>
    <polygon points="-18,0 -4,0 -10,42 -22,42" fill="#1a3a2b"/>
    <circle cx="0" cy="118" r="58" fill="url(#gold)"/>
    <circle cx="0" cy="118" r="48" fill="#141210" stroke="#f3e2c0" stroke-width="2"/>
    <text x="0" y="112" text-anchor="middle" fill="#f3e2c0" font-family="Georgia, serif" font-size="20" font-weight="700">LIVE</text>
    <text x="0" y="136" text-anchor="middle" fill="#9a7340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">NO LOGIN</text>
    <text x="0" y="214" text-anchor="middle" fill="#e7e2d8" font-family="Georgia, serif" font-size="15">Clickable demos</text>
  </g>
</svg>
